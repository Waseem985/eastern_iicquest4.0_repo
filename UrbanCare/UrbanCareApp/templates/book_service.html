<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Service</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f7fb;
}

/* TOP BAR */
.header{
    background:#0F1B2D;
    color:white;
    padding:15px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header a{
    background:#F5A623;
    color:#0F1B2D;
    padding:7px 12px;
    text-decoration:none;
    border-radius:6px;
    font-weight:bold;
}

/* MAIN WRAPPER */
.container{
    width:90%;
    max-width:850px;
    margin:30px auto;
}

/* CARD */
.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

/* PROVIDER SECTION */
.provider{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#0F1B2D;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
}

.name{
    font-size:18px;
    font-weight:bold;
    color:#0F1B2D;
}

.sub{
    font-size:13px;
    color:gray;
}

/* SERVICE BOX */
.service-box{
    background:#f8f9fa;
    padding:15px;
    border-radius:10px;
    margin:15px 0;
}

.service-title{
    font-size:12px;
    color:gray;
}

.service-name{
    font-size:16px;
    font-weight:bold;
    color:#0F1B2D;
}

/* FORM */
label{
    font-size:13px;
    font-weight:bold;
    display:block;
    margin-bottom:6px;
    color:#333;
}

textarea{
    width:100%;
    height:100px;
    padding:10px;
    border-radius:8px;
    border:1px solid #ddd;
    resize:none;
}

textarea:focus{
    border-color:#F5A623;
    outline:none;
    box-shadow:0 0 0 3px rgba(245,166,35,0.15);
}

/* BUTTON */
button{
    width:100%;
    padding:12px;
    margin-top:15px;
    background:#F5A623;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#e6951b;
}

</style>
</head>

<body>

<div class="header">
    <h2>Book Service</h2>
    <a href="{% url 'homepage' %}">Home</a>
</div>

<div class="container">

    <div class="card">

        <!-- PROVIDER -->
        <div class="provider">

            <div class="avatar">
                {{ provider.first_name|first|upper }}
            </div>

            <div>
                <div class="name">
                    {{ provider.first_name }}
                </div>
                <div class="sub">
                    Verified Service Provider
                </div>
            </div>

        </div>

        <!-- SERVICE -->
        <div class="service-box">
            <div class="service-title">Service Selected</div>
            <div class="service-name">{{ service }}</div>
        </div>

        <!-- BOOKING FORM -->
        <form method="POST">
            {% csrf_token %}

            <label>Describe your issue</label>
            <textarea name="note" placeholder="Write details..."></textarea>

            <button type="submit">
                Confirm Booking
            </button>

        </form>

    </div>

</div>

</body>
</html>
